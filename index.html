<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aryan Mane — Resume</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #525659;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #323639;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .title {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0066cc;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 6px;
      transition: background 0.15s ease;
    }

    .download-btn:hover {
      background: #0052a3;
    }

    .download-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Resume container */
    .viewer-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      overflow-y: auto;
    }

    .page-wrapper {
      max-width: 900px;
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    canvas {
      width: 100%;
      height: auto;
      max-width: 900px;
      background: #ffffff;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
      border-radius: 2px;
      display: block;
    }

    .loading {
      color: #e0e0e0;
      font-size: 15px;
      margin-top: 40px;
    }

    @media (max-width: 600px) {
      .toolbar {
        padding: 8px 12px;
      }
      .title {
        font-size: 14px;
      }
      .download-btn {
        padding: 6px 12px;
        font-size: 13px;
      }
      .viewer-container {
        padding: 12px 8px;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <header class="toolbar">
    <div class="title">Aryan Mane — Resume</div>
    <a href="/AryanMane.pdf" download="Aryan_Mane_Resume.pdf" class="download-btn">
      <svg viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span>Download PDF</span>
    </a>
  </header>

  <main class="viewer-container" id="viewer">
    <div id="loading" class="loading">Loading resume...</div>
  </main>

  <script>
    const url = '/AryanMane.pdf';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const viewer = document.getElementById('viewer');
    const loading = document.getElementById('loading');

    pdfjsLib.getDocument(url).promise.then(function(pdf) {
      loading.remove();
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        pdf.getPage(pageNum).then(function(page) {
          const wrapper = document.createElement('div');
          wrapper.className = 'page-wrapper';

          const canvas = document.createElement('canvas');
          wrapper.appendChild(canvas);
          viewer.appendChild(wrapper);

          const context = canvas.getContext('2d');
          // Scale by 2x for sharp rendering on retina / high-DPI screens
          const pixelRatio = Math.max(window.devicePixelRatio || 1, 2);
          const viewport = page.getViewport({ scale: pixelRatio });

          canvas.height = viewport.height;
          canvas.width = viewport.width;

          page.render({
            canvasContext: context,
            viewport: viewport
          });
        });
      }
    }).catch(function(err) {
      console.error('Error rendering PDF with PDF.js:', err);
      // Fallback: render pre-generated high-res image
      loading.innerHTML = '<img src="/resume-page-1.png" alt="Resume" style="width:100%;max-width:900px;box-shadow:0 4px 24px rgba(0,0,0,0.35);border-radius:2px;">';
    });
  </script>
</body>
</html>
